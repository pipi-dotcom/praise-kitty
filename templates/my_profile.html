{% extends "base.html" %}

{% block title %}My Profile - Praise Team Kitty{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-12">
        <div class="card mt-4">
            <div class="card-header bg-royal-blue">
            <h5 class="mb-0">Update My Profile</h5>
            </div>
            <div class="card-body">
                <form action="/my_profile" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">Username *</label>
        <input type="text" class="form-control" name="username" value="{{ member['username'] or '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" name="phone" value="{{ member['phone'] or '' }}">
    </div>
    <button type="submit" class="btn btn-primary w-100">Save</button>
</form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
